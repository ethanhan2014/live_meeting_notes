name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: ./scripts/test-portable-windows.ps1
      - run: npm run build -- --bundles nsis
      - name: Prepare and verify the standalone CPU runtime
        run: ./scripts/prepare-portable-windows.ps1 -AppDirectory src-tauri/target/release -OutputDirectory resources/portable
      - name: Build public Windows download
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "dist/releases/Live-Meeting-Notes-$version-windows-x64-portable.exe"
          ./scripts/build-portable-windows.ps1 -PayloadDirectory resources/portable -Output $portable
          ./scripts/verify-portable-windows.ps1 -Executable $portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-release
          compression-level: 0
          path: dist/releases/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Live Meeting Notes $RELEASE_TAG" --notes-file docs/release-notes.md || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/* --clobber
