name: Release macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Verify CPU speech on Apple Silicon
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r python/requirements.txt
          curl -fLsS https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -o "$RUNNER_TEMP/jfk-full.wav"
          .venv/bin/python -c 'import os,wave; source=wave.open(os.environ["RUNNER_TEMP"]+"/jfk-full.wav","rb"); target=wave.open(os.environ["RUNNER_TEMP"]+"/jfk.wav","wb"); target.setparams(source.getparams()); target.writeframes(source.readframes(88000)); target.close(); source.close()'
          node scripts/native-smoke.cjs "$RUNNER_TEMP/jfk.wav"
      - run: npm run dist:mac
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/releases/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: release
      - name: Publish Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Live Meeting Notes $RELEASE_TAG" --notes-file docs/release-notes.md || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/* --clobber
