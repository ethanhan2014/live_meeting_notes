name: Check Windows portable artifact
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Existing Windows artifact run
        required: true
        default: '46072409293'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: artifact
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - run: ./scripts/verify-portable-windows.ps1 -Executable (Get-ChildItem artifact/*portable.exe).FullName
